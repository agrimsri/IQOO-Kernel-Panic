<!doctype html>
<!-- Test fixture: a home-grown cookie notice with a large Accept button and only a small "Manage options" text link. Synthetic. -->
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture: generic notice</title>
<style>
  body { font-family: sans-serif; margin: 0; }
  .cookie-notice { position: fixed; bottom: 0; left: 0; right: 0; background: #222; color: #fff; padding: 16px; }
  .cookie-notice .accept { display: block; width: 100%; padding: 18px; font-size: 18px; }
  .cookie-notice .manage { font-size: 11px; color: #aaa; }
</style></head>
<body>
<main><h1>Travel deals</h1><p>Offers end soon.</p></main>
<div class="cookie-notice">
  <p>We use cookies for analytics and personalised advertising. By continuing you agree to our use of cookies.</p>
  <button class="accept">Accept &amp; continue</button>
  <a class="manage" href="#prefs">Manage options</a>
</div>
</body></html>
