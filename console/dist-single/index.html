previstas em regulamentação para o atendimento do princípio do livre acesso: … I - finalidade específica do tratamento; … VII - direitos do titular, com menção explícita aos direitos contidos no art. 18 desta Lei.","language":"pt","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm","retrieved":"2026-10-10","englishSummary":"People have the right to easy access to clear, adequate and prominent information about the processing, including its specific purpose (I) and their rights, explicitly mentioning those in Art. 18 (VII)."},{"id":"br.lgpd-9-1","profile":"BRAZIL","source":"Lei nº 13.709/2018 (LGPD), Art. 9º, § 1º","title":"Consent is void without prior clear information","kind":"LAW","verbatim":true,"text":"§ 1º Na hipótese em que o consentimento é requerido, esse será considerado nulo caso as informações fornecidas ao titular tenham conteúdo enganoso ou abusivo ou não tenham sido apresentadas previamente com transparência, de forma clara e inequívoca.","language":"pt","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm","retrieved":"2026-10-10","englishSummary":"Where consent is required, it is void if the information given was misleading or abusive, or was not presented beforehand transparently, clearly and unequivocally."},{"id":"br.lgpd-14-1","profile":"BRAZIL","source":"Lei nº 13.709/2018 (LGPD), Art. 14, § 1º","title":"Children: a parent's specific consent","kind":"LAW","verbatim":true,"text":"§ 1º O tratamento de dados pessoais de crianças deverá ser realizado com o consentimento específico e em destaque dado por pelo menos um dos pais ou pelo responsável legal.","language":"pt","url":"https://www.planalto.gov.br/ccivil_03/_ato2015-2018/2018/lei/l13709.htm","retrieved":"2026-10-10","englishSummary":"Children's personal data must be processed with specific, highlighted consent from at least one parent or legal guardian."},{"id":"br.eca-1","profile":"BRAZIL","source":"Lei nº 15.211/2025 (ECA Digital), Art. 1º","title":"Scope: services for or likely used by children","kind":"LAW","verbatim":true,"text":"Esta Lei dispõe sobre a proteção de crianças e de adolescentes em ambientes digitais e aplica-se a todo produto ou serviço de tecnologia da informação direcionado a crianças e a adolescentes no País ou de acesso provável por eles, independentemente de sua localização, desenvolvimento, fabricação, oferta, comercialização e operação.","language":"pt","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm","retrieved":"2026-10-10","englishSummary":"The law protects children and adolescents in digital environments and applies to every IT product or service directed at them in Brazil or likely to be accessed by them."},{"id":"br.eca-22","profile":"BRAZIL","source":"Lei nº 15.211/2025 (ECA Digital), Art. 22 (in force since 17 March 2026, Art. 41-A)","title":"No profiling to target ads at children","kind":"LAW","verbatim":true,"text":"Art. 22. Para além das demais disposições desta Lei, é vedada a utilização de técnicas de perfilamento para direcionamento de publicidade comercial a crianças e a adolescentes, bem como o emprego de análise emocional, de realidade aumentada, de realidade estendida e de realidade virtual para esse fim.","language":"pt","url":"https://www.planalto.gov.br/ccivil_03/_ato2023-2026/2025/lei/l15211.htm","retrieved":"2026-10-10","englishSummary":"Using profiling techniques to target commercial advertising at children and adolescents is prohibited, as is using emotional analysis, augmented, extended or virtual reality for that purpose."},{"id":"sg.pdpa-13","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 13","title":"Consent required","kind":"LAW","verbatim":true,"text":"13. An organisation must not, on or after 2 July 2014, collect, use or disclose personal data about an individual unless — (a) the individual gives, or is deemed to have given, his or her consent under this Act to the collection, use or disclosure, as the case may be; or (b) the collection, use or disclosure (as the case may be) without the individual’s consent is required or authorised under this Act or any other written law.","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpa-14(1)","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 14(1)","title":"Consent needs the purposes first","kind":"LAW","verbatim":true,"text":"14.—(1) An individual has not given consent under this Act for the collection, use or disclosure of personal data about the individual by an organisation for a purpose unless — (a) the individual has been provided with the information required under section 20; and (b) the individual provided his or her consent for that purpose in accordance with this Act.","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpa-14(2)","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 14(2)-(3)","title":"No forced or deceptive consent","kind":"LAW","verbatim":true,"text":"(2) An organisation must not — (a) as a condition of providing a product or service, require an individual to consent to the collection, use or disclosure of personal data about the individual beyond what is reasonable to provide the product or service to that individual; or (b) obtain or attempt to obtain consent for collecting, using or disclosing personal data by providing false or misleading information with respect to the collection, use or disclosure of the personal data, or using deceptive or misleading practices. (3) Any consent given in any of the circumstances in subsection (2) is not validly given for the purposes of this Act.","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpa-15A(2)","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 15A(2)","title":"Deemed consent by notification","kind":"LAW","verbatim":true,"text":"(2) Subject to subsection (3), an individual is deemed to consent to the collection, use or disclosure of personal data about the individual by an organisation if — (a) the organisation satisfies the requirements in subsection (4); and (b) the individual does not notify the organisation, before the expiry of the period mentioned in subsection (4)(b)(iii), that the individual does not consent to the proposed collection, use or disclosure of the personal data by the organisation.","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpa-16","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 16(1) and (4)","title":"Withdrawal of consent","kind":"LAW","verbatim":true,"text":"16.—(1) On giving reasonable notice to the organisation, an individual may at any time withdraw any consent given, or deemed to have been given under this Act, in respect of the collection, use or disclosure by that organisation of personal data about the individual for any purpose. … (4) Subject to section 25, if an individual withdraws consent to the collection, use or disclosure of personal data about the individual by an organisation for any purpose, the organisation must cease (and cause its data intermediaries and agents to cease) collecting, using or disclosing the personal data (as the case may be) unless such collection, use or disclosure (as the case may be) without the individual’s consent is required or authorised under this Act or other written law.","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpa-20(1)(a)","profile":"SINGAPORE","source":"Personal Data Protection Act 2012, section 20(1)(a)","title":"Purposes on or before collection","kind":"LAW","verbatim":true,"text":"20.—(1) For the purposes of sections 14(1)(a) and 18(b), an organisation must inform the individual of — (a) the purposes for the collection, use or disclosure of the personal data (as the case may be) on or before collecting the personal data;","language":"en","url":"https://sso.agc.gov.sg/Act/PDPA2012?ProvIds=P14-","retrieved":"2026-10-10"},{"id":"sg.pdpc-children-4.5","profile":"SINGAPORE","source":"PDPC Advisory Guidelines on the PDPA for Children's Personal Data in the Digital Environment (28 March 2024), paragraph 4.5","title":"Children under 13: a parent's or guardian's consent","kind":"GUIDANCE","verbatim":true,"text":"Where the child is below 13 years of age, the organisation must obtain consent from the child’s parent or guardian … The parent or guardian should be notified of the purpose(s) for which the child’s personal data will be collected, used, and disclosed.","language":"en","url":"https://www.pdpc.gov.sg/-/media/files/pdpc/pdf-files/advisory-guidelines/advisory-guidelines-on-the-pdpa-for-children's-personal-data-in-the-digital-environment_mar24.pdf","retrieved":"2026-10-10"},{"id":"gb.wait-for-consent","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Wait for an opt-in","kind":"GOOD_PRACTICE","verbatim":false,"text":"Start analytics, advertising and attribution SDKs only after the person opts in. Until then, do not contact their endpoints.","language":"en"},{"id":"gb.refusal-sticks","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"A refusal sticks","kind":"GOOD_PRACTICE","verbatim":false,"text":"After someone refuses, keep tracking SDKs off and do not contact their endpoints, now or on later launches.","language":"en"},{"id":"gb.no-preticked","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Optional choices start off","kind":"GOOD_PRACTICE","verbatim":false,"text":"Leave every optional choice switched off until the person turns it on.","language":"en"},{"id":"gb.equal-choice","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Refusing as easy as accepting","kind":"GOOD_PRACTICE","verbatim":false,"text":"Make refusing as quick and as visible as accepting: one tap each, with equal prominence.","language":"en"},{"id":"gb.per-purpose","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"One choice per purpose","kind":"GOOD_PRACTICE","verbatim":false,"text":"Ask separately for each purpose (for example analytics, advertising, personalisation) instead of one button for all.","language":"en"},{"id":"gb.clear-notice","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Say what, why and who","kind":"GOOD_PRACTICE","verbatim":false,"text":"Before collecting, say in plain language which data is collected, for which purposes, and which companies receive it.","language":"en"},{"id":"gb.withdraw","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Easy to change your mind","kind":"GOOD_PRACTICE","verbatim":false,"text":"Tell people how to change or withdraw their choice later, and make that as easy as giving it.","language":"en"},{"id":"gb.languages","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Your audience's languages","kind":"GOOD_PRACTICE","verbatim":false,"text":"Offer the notice in the languages your audience reads.","language":"en"},{"id":"gb.children","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Extra care for children","kind":"GOOD_PRACTICE","verbatim":false,"text":"In apps for children, avoid tracking and behavioural advertising, and involve a parent wherever consent is needed.","language":"en"},{"id":"gb.identifiers","profile":"GLOBAL_BASELINE","source":"TraceVeil consent-first baseline (good practice, not law)","title":"Identifiers wa
